<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Hokm Royal</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    background:#101418;
    color:white;
    font-family:Arial,Tahoma,sans-serif;
    overflow:hidden;
}

.game{
    width:100vw;
    height:100vh;
    position:relative;
    background:
        radial-gradient(circle at center,#193d2b 0%,#0b2117 55%,#07100c 100%);
}

/* بالای صفحه */
.top{
    position:absolute;
    top:12px;
    left:0;
    right:0;
    text-align:center;
    z-index:10;
}

.title{
    font-size:20px;
    font-weight:bold;
}

.info{
    margin-top:6px;
    font-size:13px;
    color:#ddd;
}

/* میز */
.table{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:min(92vw,650px);
    height:min(65vh,500px);
    border-radius:48%;
    background:
        radial-gradient(circle,#217448,#155b36 60%,#0d3b24);
    border:10px solid #4c2b17;
    box-shadow:
        inset 0 0 40px rgba(0,0,0,.55),
        0 20px 60px rgba(0,0,0,.7);
}

/* بازیکنان */
.player{
    position:absolute;
    width:90px;
    text-align:center;
    z-index:8;
}

.avatar{
    width:58px;
    height:58px;
    margin:auto;
    border-radius:50%;
    background:linear-gradient(145deg,#444,#111);
    border:3px solid #ddd;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
    box-shadow:0 4px 15px #000;
}

.name{
    margin-top:5px;
    font-size:12px;
    font-weight:bold;
    text-shadow:0 2px 3px #000;
}

.you{
    color:#ffd43b;
}

/* جای بازیکنان */
.bottom{
    left:50%;
    bottom:8px;
    transform:translateX(-50%);
}

.topplayer{
    left:50%;
    top:5px;
    transform:translateX(-50%);
}

.leftplayer{
    left:5px;
    top:50%;
    transform:translateY(-50%);
}

.rightplayer{
    right:5px;
    top:50%;
    transform:translateY(-50%);
}

/* مرکز بازی */
.center{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:230px;
    height:170px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.played{
    width:72px;
    height:100px;
    border-radius:7px;
    background:white;
    color:#111;
    position:absolute;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:7px;
    font-weight:bold;
    box-shadow:0 5px 15px #000;
}

.played:nth-child(1){transform:translate(-45px,-20px) rotate(-8deg)}
.played:nth-child(2){transform:translate(45px,-20px) rotate(8deg)}
.played:nth-child(3){transform:translate(-45px,20px) rotate(-5deg)}
.played:nth-child(4){transform:translate(45px,20px) rotate(5deg)}

.red{
    color:#e3262e;
}

.black{
    color:#111;
}

.card-symbol{
    font-size:28px;
}

.card-rank{
    font-size:18px;
}

/* کارت‌های بازیکن */
.hand{
    position:absolute;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    height:145px;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    direction:ltr;
    z-index:20;
}

.card{
    width:57px;
    height:82px;
    margin-left:-17px;
    border-radius:7px;
    background:linear-gradient(135deg,#fff,#e9e9e9);
    color:#111;
    border:2px solid #fff;
    box-shadow:0 5px 12px rgba(0,0,0,.65);
    position:relative;
    padding:5px;
    cursor:pointer;
    transition:.15s;
    flex-shrink:0;
}

.card:first-child{
    margin-left:0;
}

.card:active{
    transform:translateY(-25px) scale(1.08);
}

.card.red{
    color:#d71920;
}

.card .small{
    font-size:15px;
    font-weight:bold;
}

.card .big{
    font-size:30px;
    text-align:center;
    margin-top:8px;
}

/* کارت پشت */
.back{
    background:
      repeating-linear-gradient(
        45deg,
        #123f9a,
        #123f9a 5px,
        #245bc0 5px,
        #245bc0 10px
      );
    border:3px solid white;
}

/* وضعیت */
.status{
    position:absolute;
    top:60px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,.55);
    padding:7px 15px;
    border-radius:20px;
    font-size:13px;
    z-index:30;
}

/* حکم */
.trump{
    position:absolute;
    top:88px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(255,193,7,.95);
    color:#111;
    padding:5px 14px;
    border-radius:15px;
    font-size:13px;
    font-weight:bold;
    z-index:30;
}

/* امتیاز */
.score{
    position:absolute;
    top:12px;
    right:12px;
    background:rgba(0,0,0,.55);
    border-radius:12px;
    padding:8px 12px;
    font-size:12px;
    z-index:30;
}

/* موبایل */
@media(max-width:500px){

    .table{
        width:94vw;
        height:58vh;
        border-width:8px;
    }

    .player{
        width:72px;
    }

    .avatar{
        width:48px;
        height:48px;
        font-size:22px;
    }

    .name{
        font-size:10px;
    }

    .card{
        width:48px;
        height:72px;
        margin-left:-15px;
    }

    .card .big{
        font-size:25px;
    }

    .hand{
        height:125px;
    }

    .center{
        transform:translate(-50%,-50%) scale(.8);
    }
}
</style>
</head>

<body>

<div class="game">

    <div class="top">
        <div class="title">🎴 حکم رویال</div>
        <div class="info">دست اول • بازی دوستانه</div>
    </div>

    <div class="score">
        شما: 0 🏆<br>
        حریف: 0
    </div>

    <div class="status">
        🎯 نوبت شماست
    </div>

    <div class="trump">
        👑 حکم: ♥️
    </div>

    <div class="table">

        <!-- بازیکن بالا -->
        <div class="player topplayer">
            <div class="avatar">🤖</div>
            <div class="name">حریف</div>
        </div>

        <!-- بازیکن چپ -->
        <div class="player leftplayer">
            <div class="avatar">🤖</div>
            <div class="name">یار شما</div>
        </div>

        <!-- بازیکن راست -->
        <div class="player rightplayer">
            <div class="avatar">🤖</div>
            <div class="name">حریف ۲</div>
        </div>

        <!-- کارت‌های وسط -->
        <div class="center">

            <div class="played red">
                <span class="card-rank">A</span>
                <span class="card-symbol">♥</span>
            </div>

            <div class="played black">
                <span class="card-rank">K</span>
                <span class="card-symbol">♠</span>
            </div>

            <div class="played red">
                <span class="card-rank">10</span>
                <span class="card-symbol">♦</span>
            </div>

            <div class="played black">
                <span class="card-rank">J</span>
                <span class="card-symbol">♣</span>
            </div>

        </div>

    </div>

    <!-- بازیکن شما -->
    <div class="player bottom">
        <div class="avatar">😎</div>
        <div class="name you">شما</div>
    </div>

    <!-- دست کارت -->
    <div class="hand">

        <div class="card red" onclick="playCard(this)">
            <div class="small">A ♥</div>
            <div class="big">♥</div>
        </div>

        <div class="card black" onclick="playCard(this)">
            <div class="small">K ♠</div>
            <div class="big">♠</div>
        </div>

        <div class="card red" onclick="playCard(this)">
            <div class="small">10 ♦</div>
            <div class="big">♦</div>
        </div>

        <div class="card black" onclick="playCard(this)">
            <div class="small">J ♣</div>
            <div class="big">♣</div>
        </div>

        <div class="card red" onclick="playCard(this)">
            <div class="small">9 ♥</div>
            <div class="big">♥</div>
        </div>

        <div class="card black" onclick="playCard(this)">
            <div class="small">8 ♠</div>
            <div class="big">♠</div>
        </div>

        <div class="card red" onclick="playCard(this)">
            <div class="small">7 ♦</div>
            <div class="big">♦</div>
        </div>

        <div class="card black" onclick="playCard(this)">
            <div class="small">Q ♣</div>
            <div class="big">♣</div>
        </div>

    </div>

</div>

<script>

function playCard(card){

    if(card.classList.contains("used")){
        return;
    }

    card.classList.add("used");

    card.style.transform="translateY(-120px) scale(1.15)";
    card.style.opacity="0";

    setTimeout(function(){
        card.remove();
        document.querySelector(".status").innerText="⏳ کارت شما بازی شد";
    },250);
}

</script>

</body>
</html>
